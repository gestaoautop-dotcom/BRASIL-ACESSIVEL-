<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Departamento de ideias malucas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-live="polite">
    <section class="screen screen--intro is-active" id="page-1" aria-label="Página 1">
      <div class="intro-wrap">
        <h1>Departamento de<br class="desktop-break"> ideias malucas</h1>
        <button class="enter-btn" id="enterBtn" type="button"><span>Estou ciente e desejo continuar</span><span class="arrow">→</span></button>
      </div>
      <div class="hint">clique para entrar</div>
    </section>

    <section class="screen screen--politics" id="page-2" aria-label="Página 2">
      <div class="politics-stage">
        <div class="eyebrow">PÁGINA 02</div>
        <h2>Desenrolando a política Brasileira</h2>

        <div class="animation-shell" aria-label="Ilustração animada de um novelo colorido representando a política brasileira sendo desenrolada">
          <svg class="politics-svg" viewBox="0 0 900 620" role="img" aria-hidden="true">
            <g class="building">
              <rect x="640" y="180" width="165" height="150" rx="10" fill="#f5f2e8" stroke="#111" stroke-width="5"/>
              <polygon points="625,185 722,120 820,185" fill="#f5f2e8" stroke="#111" stroke-width="5"/>
              <line x1="665" y1="210" x2="665" y2="300" stroke="#111" stroke-width="5"/>
              <line x1="705" y1="210" x2="705" y2="300" stroke="#111" stroke-width="5"/>
              <line x1="745" y1="210" x2="745" y2="300" stroke="#111" stroke-width="5"/>
              <line x1="785" y1="210" x2="785" y2="300" stroke="#111" stroke-width="5"/>
              <line x1="632" y1="330" x2="814" y2="330" stroke="#111" stroke-width="5"/>
              <line x1="620" y1="350" x2="825" y2="350" stroke="#111" stroke-width="5"/>
              <line x1="650" y1="132" x2="650" y2="75" stroke="#111" stroke-width="5"/>
              <rect x="650" y="75" width="72" height="42" fill="#159447"/>
              <circle cx="686" cy="96" r="13" fill="#f5d538"/>
              <polygon points="686,86 696,96 686,106 676,96" fill="#2b55b6"/>
            </g>

            <g class="tangle">
              <path d="M170 360 C280 210 430 510 550 300 S760 250 630 430 S330 480 210 320" stroke="#ffce21" stroke-width="18" fill="none" stroke-linecap="round"/>
              <path d="M210 260 C340 480 470 170 610 360 S400 530 260 410 S300 180 540 240" stroke="#ff5b38" stroke-width="15" fill="none" stroke-linecap="round"/>
              <path d="M190 410 C350 140 520 540 680 290 S470 130 300 300 S450 470 620 430" stroke="#2096f3" stroke-width="14" fill="none" stroke-linecap="round"/>
              <path d="M250 190 C260 390 540 190 600 420 S310 560 190 470" stroke="#8acb45" stroke-width="12" fill="none" stroke-linecap="round"/>
              <path d="M150 320 C360 230 310 510 620 280" stroke="#9a63c7" stroke-width="10" fill="none" stroke-linecap="round"/>
              <path d="M220 450 C400 350 410 170 700 390" stroke="#111" stroke-width="7" fill="none" stroke-linecap="round"/>
            </g>

            <g class="person person-left">
              <circle cx="120" cy="360" r="18" fill="#ffd0b3" stroke="#111" stroke-width="4"/>
              <path d="M120 380 L120 445 M120 400 L82 425 M120 405 L155 390 M120 445 L96 490 M120 445 L148 486" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
              <path d="M155 390 L205 365" stroke="#111" stroke-width="5" stroke-linecap="round"/>
            </g>

            <g class="person person-right">
              <circle cx="760" cy="430" r="18" fill="#ffd0b3" stroke="#111" stroke-width="4"/>
              <path d="M760 448 L760 512 M760 468 L720 450 M760 470 L797 445 M760 512 L735 555 M760 512 L790 554" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
              <path d="M720 450 L665 425" stroke="#111" stroke-width="5" stroke-linecap="round"/>
            </g>

            <g class="paper p1"><rect x="110" y="145" width="95" height="65" rx="8" fill="#fff" stroke="#111" stroke-width="4"/><line x1="127" y1="168" x2="185" y2="168" stroke="#111" stroke-width="4"/><line x1="127" y1="185" x2="172" y2="185" stroke="#111" stroke-width="4"/></g>
            <g class="paper p2"><rect x="515" y="92" width="92" height="66" rx="8" fill="#fff" stroke="#111" stroke-width="4"/><path d="M533 130 l18 -18 l18 20 l18 -28" stroke="#ef3340" stroke-width="5" fill="none"/></g>
            <g class="book"><rect x="420" y="505" width="115" height="70" rx="8" fill="#2096f3" stroke="#111" stroke-width="4"/><text x="477" y="549" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">LEIS</text></g>
            <g class="money"><circle cx="612" cy="515" r="37" fill="#f7db5a" stroke="#111" stroke-width="4"/><text x="612" y="527" text-anchor="middle" font-family="Georgia,serif" font-size="34" font-weight="700">R$</text></g>

            <path class="loose-thread" d="M82 425 C20 455 25 520 90 530" stroke="#ffce21" stroke-width="12" fill="none" stroke-linecap="round"/>
            <path class="loose-thread loose-thread-2" d="M798 446 C865 420 880 360 842 320" stroke="#ff5b38" stroke-width="10" fill="none" stroke-linecap="round"/>
          </svg>
          <div class="float-dot dot-a"></div><div class="float-dot dot-b"></div><div class="float-dot dot-c"></div>
        </div>

        <button class="next-btn" id="nextBtn" type="button" aria-label="Ir para a próxima página">→</button>
      </div>
      <button class="back-btn" id="backBtn" type="button" aria-label="Voltar">←</button>
    </section>

    <section class="screen screen--placeholder" id="page-3" aria-label="Página 3">
      <div><span>03</span><h2>Próxima ideia<br>em construção.</h2></div>
      <button class="back-btn" id="backBtn3" type="button" aria-label="Voltar">←</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
