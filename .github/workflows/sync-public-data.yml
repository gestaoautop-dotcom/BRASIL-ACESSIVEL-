name: Sincronizar dados publicos TIMTIM
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: timtim-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Coletar fontes oficiais
        run: node scripts/sync-public-data.mjs
      - name: Salvar dados e historico
        if: always()
        run: |
          git config user.name "timtim-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/
          if ! git diff --cached --quiet; then
            git commit -m "data: sincronizar fontes oficiais [skip ci]"
            git push
          fi
